[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docket-idp"
dynamic = ["version"]
description = "Invoice and receipt data extraction with OCR and LLMs — validated JSON, source citations, human review, EU e-invoicing export"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Artem Kazakov Kozlov" }]
requires-python = ">=3.10"
keywords = [
    "invoice", "receipt", "ocr", "llm", "document-ai", "idp",
    "e-invoicing", "ubl", "peppol", "zugferd", "factur-x", "xrechnung", "facturae",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pdfplumber>=0.11",
    "pypdfium2>=4.20",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < \"3.11\"",
    "scikit-learn>=1.4",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
tracing = [
    "langfuse>=2.0",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
# PaddleOCR backend (`--ocr-backend paddle`), including its table-structure
# pipeline. Heavy (PaddlePaddle + models downloaded on first use), so never
# part of the base install.
paddle = [
    "paddlepaddle>=3.0,<4",
    "paddleocr>=3.0,<4",
    "paddlex[ocr]>=3.0,<4",
]
# Docling layout pipeline and TableFormer. Models are downloaded by Docling
# on first use; importing docket never imports this optional dependency.
docling = [
    "docling>=2.81,<3",
]
# Official e-invoice validation (XSD via lxml, Schematron via SaxonC-HE).
# The validation artifacts themselves ship with the base package.
einvoice = [
    "factur-x>=6.8,<7",
    "lxml>=5.0",
    "saxonche>=12.5",
]
all = [
    "docket-idp[api,tracing,einvoice,postgres]",
]
eval = [
    "datasets>=2.19",
]
dev = [
    "docket-idp[api,eval,einvoice]",
    # The Streamlit demo (examples/streamlit_demo.py) is a repo-only dev tool.
    "streamlit>=1.49",
    "pytest>=8.0",
    # Test fixtures only (builds PDFs with a text layer); never a runtime
    # dependency, so its AGPL license does not reach installed users.
    "pymupdf>=1.24",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
docket = "docket.cli:main"
docket-api = "docket.api:run"

[project.urls]
Homepage = "https://github.com/KazKozDev/docket"
Documentation = "https://github.com/KazKozDev/docket#readme"
Repository = "https://github.com/KazKozDev/docket"
Issues = "https://github.com/KazKozDev/docket/issues"
Changelog = "https://github.com/KazKozDev/docket/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "docket.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docket = ["py.typed", "einvoice/resources/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "paddle: runs the real PaddleOCR engine (skipped when it is not installed)",
]
pythonpath = ["."]
