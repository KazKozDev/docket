[project]
name = "docket"
version = "0.1.0"
description = "Invoice and receipt data extraction with OCR and LLMs — validated JSON, source citations, human review"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
    "rich>=13.7",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "python-stdnum>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
eval = [
    "datasets>=2.19",
]
tracing = [
    "langfuse>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
