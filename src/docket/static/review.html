<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docket Review</title><style>
:root{color-scheme:dark;font:13px Inter,system-ui,sans-serif;background:#09090b;color:#e4e4e7}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-columns:248px minmax(420px,1fr) 360px}.pane{border-color:#ffffff14}.queue{border-right:1px solid #ffffff14;overflow:auto}.head{height:44px;padding:0 12px;border-bottom:1px solid #ffffff14;background:#0e0e11;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2}.task{width:100%;padding:12px;border:0;border-bottom:1px solid #ffffff0f;background:none;color:inherit;text-align:left}.task:hover,.task.active{background:#ffffff0a}.muted{font:10px ui-monospace,monospace;color:#71717a}.reason{margin-top:6px;font-size:10px;color:#a1a1aa}.viewer{display:flex;flex-direction:column;min-width:0}.stage{flex:1;overflow:auto;padding:24px;background:#070709;display:flex;justify-content:center;align-items:flex-start}.page{position:relative;width:min(100%,900px);background:white;box-shadow:0 20px 60px #000}.page img{display:block;width:100%}.box{position:absolute;border:2px solid #06b6d4;background:#67e8f926}.box.selected{border-color:#f43f5e;background:#fb718533}.inspector{border-left:1px solid #ffffff14;display:flex;flex-direction:column;overflow:hidden;background:#0e0e11}.tabs{justify-content:flex-start;gap:4px}.tabs button{border:0;background:none;color:#71717a;padding:6px 9px}.tabs button.active{background:#ffffff0d;color:white}.content{flex:1;overflow:auto}.field,.revision,.issue{display:block;padding:12px 16px;border-bottom:1px solid #ffffff0f}.field.active{background:#08334455}.field span{display:block;margin-bottom:5px}.field input{width:100%;color:#e4e4e7;background:transparent;border:0;border-bottom:1px solid #ffffff1f;padding:0 0 5px;outline:none}.field input:focus{border-color:#06b6d4}.quote{margin-top:6px;color:#71717a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.issue,.error{color:#fda4af;background:#4c051933}.actions{padding:12px;border-top:1px solid #ffffff14;display:grid;grid-template-columns:40px 1fr 1fr;gap:8px}.actions button{height:36px;border:1px solid #ffffff1a;background:none;color:#d4d4d8}.actions .approve{background:#f4f4f5;color:#09090b}.actions button:disabled{opacity:.4}.error{padding:10px 16px}.empty{padding:24px;color:#71717a}@media(max-width:900px){.app{grid-template-columns:190px 1fr}.inspector{position:fixed;right:0;top:0;bottom:0;width:340px;box-shadow:-20px 0 50px #000}.stage{padding:12px}}
</style></head><body><main class="app"><aside class="queue pane"><div class="head"><b>Review queue</b><span id="count" class="muted">0</span></div><div id="tasks"></div></aside><section class="viewer"><div class="head"><span id="doc" class="muted">No task selected</span><span><button id="prev">‹</button> <span id="pages" class="muted">1 / 1</span> <button id="next">›</button></span></div><div class="stage"><div id="page" class="page"></div></div></section><aside class="inspector"><div class="head tabs"><button id="fieldsTab" class="active">Fields</button><button id="historyTab">History</button></div><div id="error"></div><div id="content" class="content"></div><div class="actions"><button id="reject" title="Reject">×</button><button id="validate">↻ Validate</button><button id="approve" class="approve">✓ Approve</button></div></aside></main><script>
const actor=localStorage.docket_reviewer||'reviewer';let tasks=[],task=null,page=1,tab='fields',selected=null,fields={};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){let r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}),b=await r.json().catch(()=>null);if(!r.ok)throw Error(b?.error?.message||`HTTP ${r.status}`);return b}
function fail(e){$('error').innerHTML=`<div class="error">${esc(e.message||e)}</div>`}
async function load(){tasks=await api('/review-queue');$('count').textContent=tasks.length;$('tasks').innerHTML=tasks.map(t=>`<button class="task ${task?.document_id===t.document_id?'active':''}" data-id="${esc(t.document_id)}"><div>${esc(t.source.split('/').pop())}${t.locked?' 🔒':''}</div><div class="muted">${esc(t.doc_type||'unknown')} · ${esc(t.status)}</div><div class="reason">${esc(t.reasons[0]||'')}</div></button>`).join('');document.querySelectorAll('.task').forEach(b=>b.onclick=()=>open(b.dataset.id));if(!task&&tasks[0])open(tasks[0].document_id)}
async function open(id){try{task=await api(`/review-queue/${id}/claim`,{method:'POST',body:JSON.stringify({actor})});fields={...(task.result.extracted||{}),...(task.corrections||{})};page=1;selected=null;$('error').innerHTML='';render();load()}catch(e){fail(e)}}
function primitives(){return Object.entries(fields).filter(([,v])=>v===null||['string','number','boolean'].includes(typeof v))}
function render(){if(!task)return;$('doc').textContent=task.document_id;let pages=task.result.layout?.pages?.length||1;$('pages').textContent=`${page} / ${pages}`;$('page').innerHTML=`<img alt="Document page ${page}" src="/review-queue/${task.document_id}/pages/${page}">`;Object.entries(task.result.field_sources||{}).forEach(([field,s])=>(s.regions||[]).filter(r=>r.page===page).forEach(r=>{let b=document.createElement('button'),x=r.bbox;b.className=`box ${selected===field?'selected':''}`;b.title=field;b.style.cssText=`left:${x.x0*100}%;top:${x.y0*100}%;width:${(x.x1-x.x0)*100}%;height:${(x.y1-x.y0)*100}%`;b.onclick=()=>{selected=field;render()};$('page').appendChild(b)}));renderSide()}
function renderSide(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id.startsWith(tab)));if(tab==='history'){$('content').innerHTML=[...(task.history||[])].reverse().map(r=>`<div class="revision"><span>${esc(r.action)}</span><span class="muted" style="float:right">v${r.version}</span><div class="muted">${esc(r.actor||'system')} · ${new Date(r.at).toLocaleString()}</div></div>`).join('');return}$('content').innerHTML=primitives().map(([k,v])=>`<label class="field ${selected===k?'active':''}" data-field="${esc(k)}"><span class="muted">${esc(k)}</span><input data-key="${esc(k)}" data-type="${typeof v}" value="${esc(v)}"><small class="quote">${esc(task.result.field_sources?.[k]?.quote||'')}</small></label>`).join('')+(task.validation_issues||[]).map(i=>`<div class="issue">${esc(i.field)}: ${esc(i.message)}</div>`).join('');document.querySelectorAll('.field').forEach(x=>x.onclick=()=>{selected=x.dataset.field;render()});document.querySelectorAll('.field input').forEach(x=>x.oninput=e=>{e.stopPropagation();fields[x.dataset.key]=x.dataset.type==='number'?Number(x.value):x.value})}
async function decide(status){if(!task?.lock_token)return;try{let corrections=Object.fromEntries(primitives().filter(([k,v])=>task.result.extracted?.[k]!==v));task=await api(`/review-queue/${task.document_id}`,{method:'PATCH',body:JSON.stringify({status,corrections,actor,lock_token:task.lock_token,expected_version:task.version})});fields={...(task.result.extracted||{}),...(task.corrections||{})};render();await load()}catch(e){fail(e)}}
$('fieldsTab').onclick=()=>{tab='fields';renderSide()};$('historyTab').onclick=()=>{tab='history';renderSide()};$('prev').onclick=()=>{page=Math.max(1,page-1);render()};$('next').onclick=()=>{page=Math.min(task?.result.layout?.pages?.length||1,page+1);render()};$('validate').onclick=()=>decide('corrected');$('approve').onclick=()=>decide('approved');$('reject').onclick=()=>decide('rejected');load().catch(fail);
</script></body></html>
