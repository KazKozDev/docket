name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-fra tesseract-ocr-ita tesseract-ocr-rus

      - name: Install docket
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
        env:
          PYTHONPATH: .
          # Every test in this repo is LLM-free by design (see README) —
          # there's no Ollama server in CI, and there shouldn't need to be.
          DOCKET_REVIEW_QUEUE: /tmp/docket-ci-review-queue.jsonl

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install "$(ls dist/*.whl)[api]"
          cd /tmp && /tmp/wheel-venv/bin/docket formats
          /tmp/wheel-venv/bin/python -c "import docket, docket.api; print(docket.__version__)"
      - name: Reject copyleft runtime dependencies
        run: |
          python -m venv /tmp/license-venv
          /tmp/license-venv/bin/pip install dist/*.whl pip-licenses
          /tmp/license-venv/bin/pip-licenses --format=json --output-file=/tmp/runtime-licenses.json
          python scripts/check_runtime_licenses.py /tmp/runtime-licenses.json
      - name: OpenAPI spec is up to date
        run: |
          pip install -e ".[api]"
          python scripts/export_openapi.py
          git diff --exit-code docs/openapi.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t docket:ci .
